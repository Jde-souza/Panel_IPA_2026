<div class="section-header">
  <h2 class="text-3xl font-bold" style="color: var(--text-heading)">Agenda Docente</h2>
  <p style="color: var(--text-muted); margin-top: 8px;">Directorio de contactos del Instituto de Profesores Artigas.</p>

  <div class="mt-8 flex flex-col md:flex-row gap-4 items-center">
    <div class="relative w-full max-w-md">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center" style="color: var(--text-muted)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input type="text" [(ngModel)]="searchText" (ngModelChange)="filterData()"
        placeholder="Buscar docente por nombre..."
        class="w-full pl-10 pr-10 py-3 rounded-2xl border focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent shadow-sm transition-all"
        style="background: var(--surface); color: var(--text-main); border-color: var(--border-color);">
      <button *ngIf="searchText" (click)="searchText = ''; filterData()"
        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #eee; border: none; color: #333; cursor: pointer; padding: 2px 6px; border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px;"
        title="Limpiar búsqueda">
        <i class="fa-solid fa-xmark" style="font-size: 14px;"></i>
      </button>
    </div>
    <div style="color: var(--text-muted); font-size: 0.875rem; font-weight: 500;">
      {{ filteredData.length }} registros encontrados
    </div>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
  <div *ngFor="let item of filteredData" class="glass-card !p-6 hover:!translate-y-[-4px] card-clickable"
    style="position: relative;" (click)="copyInfo(item)">

    <div *ngIf="activeCopyName() === item.nombre" class="copy-badge fade-in">
      <i class="fa-solid fa-check-double"></i> ¡Copiado!
    </div>

    <div class="flex items-start gap-4">
      <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0"
        style="background: rgba(0, 174, 239, 0.1); color: var(--primary-color);">
        <i class="fa-solid fa-user-tie text-xl"></i>
      </div>
      <div class="flex-grow min-w-0">
        <h3 class="text-lg font-bold truncate" [title]="item.nombre" style="color: var(--text-heading)">{{ item.nombre
          }}</h3>

        <div class="mt-4 space-y-3">
          <div class="flex items-center gap-3 text-sm group" *ngIf="item.telefono1 || item.telefono2"
            style="color: var(--text-main)">
            <i class="fa-solid fa-phone w-4" style="color: var(--primary-color)"></i>
            <div class="flex flex-col">
              <span *ngIf="item.telefono1">{{ item.telefono1 }}</span>
              <span *ngIf="item.telefono2">{{ item.telefono2 }}</span>
            </div>
          </div>

          <div class="flex items-center gap-3 text-sm group" *ngIf="item.email" style="color: var(--text-main)">
            <i class="fa-solid fa-envelope w-4" style="color: var(--primary-color)"></i>
            <span class="truncate" [title]="item.email">{{ item.email }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="filteredData.length === 0" class="flex flex-col items-center justify-center py-20"
  style="color: var(--text-muted)">
  <i class="fa-solid fa-face-frown text-5xl mb-4 opacity-20"></i>
  <p class="text-lg">No se encontraron docentes con ese nombre.</p>
</div>
