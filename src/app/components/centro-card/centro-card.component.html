<article class="glass-card fade-in card-clickable" style="padding: 20px; position: relative;" (click)="copyInfo($event)"
  (keydown.enter)="copyInfo($event)" (keydown.space)="copyInfo($event)" role="button" tabindex="0"
  [attr.aria-label]="'Centro: ' + data.nombre + '. Haz clic para copiar su información de contacto.'">

  <div *ngIf="showCopyFeedback" class="copy-badge fade-in" aria-hidden="true">
    <i class="fa-solid fa-check-double" aria-hidden="true"></i> ¡Copiado!
  </div>
  <div class="category-tag">{{data.tipo}}</div>
  <h3 style="margin-bottom: 15px; color: var(--text-heading);">{{data.nombre}}</h3>

  <div class="doe-card-body">
    <div class="doe-info-item">
      <span class="doe-info-label" style="color: var(--text-muted);"><i class="fa-solid fa-location-dot icon-margin"
          aria-hidden="true"></i> Depto:</span>
      <span class="doe-info-value" style="color: var(--text-main);">{{data.departamento}}</span>
    </div>
    <div class="doe-info-item">
      <span class="doe-info-label" style="color: var(--text-muted);"><i class="fa-solid fa-map-pin icon-margin"
          aria-hidden="true"></i> Dirección:</span>
      <span class="doe-info-value" style="color: var(--text-main);">{{data.direccion}}</span>
    </div>
    <div class="doe-info-item">
      <span class="doe-info-label" style="color: var(--text-muted);"><i class="fa-solid fa-phone icon-margin"
          aria-hidden="true"></i> Tel:</span>
      <span class="doe-info-value" style="color: var(--text-main);">{{data.telefono}}</span>
    </div>
    <div class="doe-info-item">
      <span class="doe-info-label" style="color: var(--text-muted);"><i class="fa-solid fa-envelope icon-margin"
          aria-hidden="true"></i> Email:</span>
      <a [href]="'mailto:' + data.email" class="doe-info-value info-text"
        style="color: var(--primary-color); text-decoration: none; font-weight: 600;" (click)="$event.stopPropagation()"
        [attr.aria-label]="'Enviar correo a ' + data.email">
        {{data.email}}
      </a>
    </div>
  </div>
</article>
